service: agenthub-backend

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  
  environment:
    NODE_ENV: production
    
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ce:GetCostAndUsage
        - ce:GetCostForecast
        - budgets:DescribeBudgets
        - sts:GetCallerIdentity
      Resource: "*"

functions:
  api:
    handler: src/server.handler
    events:
      - http:
          path: /{proxy+}
          method: ANY
          cors: true
      - http:
          path: /
          method: ANY
          cors: true

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001