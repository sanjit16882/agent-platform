# Docker Compose for Real MCP Servers
# This replaces the broken fake MCP implementation with real servers

version: '3.8'

services:
  # File System MCP Server
  mcp-filesystem:
    image: node:18-alpine
    container_name: agenthub-mcp-filesystem
    working_dir: /workspace
    volumes:
      - ../:/workspace:ro  # Read-only access to project files
      - ./mcp-servers/filesystem:/app
    ports:
      - "3010:3000"
    environment:
      - MCP_SERVER_TYPE=filesystem
      - FILESYSTEM_ROOT=/workspace
    command: >
      sh -c "
        cd /app &&
        npm install &&
        node filesystem-server.js
      "
    restart: unless-stopped
    networks:
      - mcp-network

  # Database MCP Server  
  mcp-database:
    image: node:18-alpine
    container_name: agenthub-mcp-database
    working_dir: /app
    volumes:
      - ./mcp-servers/database:/app
      - ./data:/data
    ports:
      - "3011:3000"
    environment:
      - MCP_SERVER_TYPE=database
      - DATABASE_PATH=/data/agenthub.db
    command: >
      sh -c "
        cd /app &&
        npm install &&
        node database-server.js
      "
    restart: unless-stopped
    networks:
      - mcp-network

  # Git MCP Server
  mcp-git:
    image: node:18-alpine
    container_name: agenthub-mcp-git
    working_dir: /workspace
    volumes:
      - ../:/workspace:ro
      - ./mcp-servers/git:/app
    ports:
      - "3012:3000"
    environment:
      - MCP_SERVER_TYPE=git
      - GIT_REPOSITORY=/workspace
    command: >
      sh -c "
        apk add --no-cache git &&
        cd /app &&
        npm install &&
        node git-server.js
      "
    restart: unless-stopped
    networks:
      - mcp-network

  # Office 365 MCP Server (Mock for now)
  mcp-office365:
    image: node:18-alpine
    container_name: agenthub-mcp-office365
    working_dir: /app
    volumes:
      - ./mcp-servers/office365:/app
    ports:
      - "3013:3000"
    environment:
      - MCP_SERVER_TYPE=office365
      - OFFICE365_CLIENT_ID=${OFFICE365_CLIENT_ID:-mock}
      - OFFICE365_CLIENT_SECRET=${OFFICE365_CLIENT_SECRET:-mock}
    command: >
      sh -c "
        cd /app &&
        npm install &&
        node office365-server.js
      "
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  mcp-data:
    driver: local